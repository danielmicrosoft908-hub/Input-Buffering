YAML
name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: latest
      - uses: actions/upload-artifact@v4
        with:
          name: Mod
          path: ${{ steps.build.outputs.build-output }}
